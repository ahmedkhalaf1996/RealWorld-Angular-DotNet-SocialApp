name: Build and Puss Docker Images

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ["Full Application Testing - Api - Realtime, frontend"]
    branches: 
      - main
      - deployment-k8s
    types: [completed]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' &&  github.event_name != 'workflow_run' }}
    steps:
        - name: Checkout code
          uses: actions/checkout@v4
    
        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
             username: ${{ secrets.DOCKER_USERNAME }}
             password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v3 
        
        # Backend Api Image
        - name: Build and Push Backend Api Image
          uses: docker/build-push-action@v5
          with:
            context: ./backend
            file: ./backend/Dockerfile.api
            push: true
            tags:  | 
              ahmedkhalaf666/social-dotnet-api:latest
              ahmedkhalaf666/social-dotnet-api:${{ github.ref_name }}
        # Realtime Chat Image
        - name: Build and Push Realtime Chat Image
          uses: docker/build-push-action@v5
          with:
            context: ./backend
            file: ./backend/Dockerfile.chat
            push: true
            tags:  | 
              ahmedkhalaf666/social-dotnet-chat:latest
              ahmedkhalaf666/social-dotnet-chat:${{ github.ref_name }}
        # Realtime Notificaton Image
        - name: Build and Push Realtime Notification Image  
          uses: docker/build-push-action@v5
          with:
            context: ./backend
            file: ./backend/Dockerfile.notification
            push: true
            tags:  | 
              ahmedkhalaf666/social-dotnet-notification:latest
              ahmedkhalaf666/social-dotnet-notification:${{ github.ref_name }}

        # Frontend Image
        - name: Build and Push Frontend Image
          uses: docker/build-push-action@v5
          with:
            context: ./frontend
            file: ./frontend/Dockerfile
            push: true
            tags:  | 
              ahmedkhalaf666/social-dotnet-frontend:latest
              ahmedkhalaf666/social-dotnet-frontend:${{ github.ref_name }}
                
 