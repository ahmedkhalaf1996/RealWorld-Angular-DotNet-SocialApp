name : Full Application Testin - Api , Realtime , Frontend

on:
    push:
        branches:
            - main
            - auto-testing
    pull_request:
        branches:
            - main
            - auto-testing

jobs:
    # backend api tests
    backend-api-tests:
        name: Backend Api Tests
        runs-on: windows-latest

        steps:
            - name: checkout Code
              uses: actions/checkout@v4
            
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                dotnet-verstion: '10.0.x'
            - name : Restore Dependencies
              run: dotnet restore backend/api/api.csproj
            
            - name: Build Backend API
              run: dotnet build backend/api/api.csproj --configuration Release --no-restore
            
            - name: Run API Tests
              run: dotnet test backend/api.Tests/api.Tests.csproj --configuration Release --no-build --logger "console;verbosity=detaild"
            
            - name: Uplaod Api Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with: 
                name: api-test-results
                path: backend/api.Tests/bin/Release/**/TestResults/